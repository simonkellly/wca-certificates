openapi: 3.1.0
info:
  title: WCA API Documentation
  summary: Documentation of the WCA API, currently in progress
  description: The WCA API allows developers to access data from the WCA using oidc
  contact:
    name: WCA Software Team
    url: https://www.worldcubeassociation.org
    email: software@worldcubeassociation.org
  version: 0.1.0
servers:
  - url: https://www.worldcubeassociation.org/api
    description: The production API server
  - url: http://localhost:3000/api
    description: Local API server
paths:
  /v1/competitions/{competitionId}/registrations:
    get:
      summary: Get competition registrations
      tags:
        - competitions
        - registrations
      operationId: competitionRegistrationsV2
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationDataV2"
  /v1/competitions/{competitionId}/registrations/admin:
    get:
      summary: Get admin view of registrations
      tags:
        - competitions
        - registrations
      operationId: getRegistrationsAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All registrations with admin info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationDataV2"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Competition not found
  /v1/competitions/{competitionId}/registration_config:
    get:
      summary: Get registration config for a competition
      tags:
        - competitions
        - registrations
      operationId: competitionRegistrationConfig
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationConfig"
  /v1/competitions/{competitionId}/live/rounds:
    get:
      summary: Gets Live Admin Information
      tags:
        - live
      operationId: liveAdmin
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns Live Admin Information with Rounds
          content:
            application/json:
              schema:
                type: object
                required:
                  - rounds
                properties:
                  rounds:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveRoundAdmin"
  /v1/competitions/{competitionId}/live/rounds/{roundId}:
    post:
      summary: Adds a live result for a given round
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLiveResult"
      responses:
        "202":
          description: Result Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
    patch:
      summary: Updates a live result for a given round
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLiveResult"
      responses:
        "200":
          description: Result Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
    get:
      summary: Gets Information about the Round including the live Results
      tags:
        - live
      operationId: liveByRound
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveRound"
  /v1/competitions/{competitionId}/live/rounds/{roundId}/batch:
    post:
      summary: Adds multiple live results for a given round in a single request
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchSubmitLiveResult"
      responses:
        "202":
          description: Batch Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /v1/competitions/{competitionId}/live/rounds/{roundId}/next_if_quit:
    get:
      summary: Get the next competitor assuming the registration in the query is quit
      tags:
        - live
      operationId: getNextCompetitor
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
        - name: registration_id
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Returns the next competitors who would advance if the registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  next_advancing:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveCompetitor"
                required:
                  - status
                  - next_advancing
  /v1/competitions/{competitionId}/live/rounds/{roundId}/addable_competitors:
    get:
      summary: Get competitors that can be added to a round
      description: |
        Returns the competitors eligible to be added to the round (the round's participation source) along with the lifecycle state of any colinked rounds.
      tags:
        - live
      operationId: canBeAddedToRound
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The eligible competitors and the states of colinked rounds
          content:
            application/json:
              schema:
                type: object
                required:
                  - registrations
                  - colinked_status
                properties:
                  registrations:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegistrationDataV2"
                  colinked_status:
                    type: array
                    items:
                      type: string
                      enum:
                        - locked
                        - open
                        - ready
                        - pending
  /v1/competitions/{competitionId}/live/rounds/{roundId}/{registrationId}:
    put:
      summary: Adds a use to a round
      tags:
        - live
      operationId: addCompetitor
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Returns the created empty live result
          content:
            application/json:
              schema:
                type: object
                required:
                  - competitor
                properties:
                  competitor:
                    $ref: "#/components/schemas/LiveCompetitor"
    delete:
      summary: Quits a competitor from the round and advances the next one if prompted
      tags:
        - live
      operationId: quitCompetitor
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                advancing_ids:
                  type: array
                  items:
                    type: number
      responses:
        "200":
          description: Returns number of rounds the competitor was marked as quit in
          content:
            application/json:
              schema:
                type: object
                required:
                  - quit
                properties:
                  quit:
                    type: number
  /v1/competitions/{competitionId}/live/rounds/{roundId}/bulk_quit:
    delete:
      summary: Quits multiple competitors from the round
      tags:
        - live
      operationId: bulkQuitCompetitors
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_ids
              properties:
                registration_ids:
                  type: array
                  items:
                    type: number
                advancing_ids:
                  type: array
                  items:
                    type: number
      responses:
        "200":
          description: Returns number of competitors that were marked as quit
          content:
            application/json:
              schema:
                type: object
                required:
                  - quit
                properties:
                  quit:
                    type: number
  /v1/competitions/{competitionId}/live/rounds/{roundId}/clear:
    put:
      summary: Clears a round deleting all results
      tags:
        - live
      operationId: clearRound
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns number of results clear
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recreated_rows
                properties:
                  status:
                    type: string
                  recreated_rows:
                    type: number
  /v1/competitions/{competitionId}/live/rounds/{roundId}/close:
    delete:
      summary: Closes an empty round, deleting all its (empty) live results
      tags:
        - live
      operationId: closeRound
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Round closed
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - deleted_count
                properties:
                  status:
                    type: string
                  deleted_count:
                    type: integer
  /v1/competitions/{competitionId}/live/rounds/{roundId}/open:
    put:
      summary: Opens a round and locks the previous round if necessary
      tags:
        - live
      operationId: openRound
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns number of locked an created results
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - created_rows
                  - locked_rows
                properties:
                  status:
                    type: string
                  created_rows:
                    type: number
                  locked_rows:
                    type: number
        "400":
          description: Round cannot be opened
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - score taking is not finished in the previous round
                      - round already open
                      - "regulation 9m3: a round with 7 or fewer competitors must not have subsequent rounds"
                      - "regulation 9m2: a round with 15 or fewer competitors must have at most one subsequent round"
                      - "regulation 9m1: a round with 99 or fewer competitors must have at most two subsequent rounds"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/NotPermitted"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
  /v1/competitions/{competitionId}/live/rounds/{roundId}/{registrationId}/clear:
    put:
      summary: Quits a competitor from the round and advances the next one if prompted
      tags:
        - live
      operationId: clearCompetitor
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Returns the number of attempts that were deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted_attempts
                properties:
                  deleted_attempts:
                    type: number
  /v1/competitions/{competitionId}/live/podiums:
    get:
      summary: Gets Information about the Podiums of the Live Results
      tags:
        - live
      operationId: livePodiums
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns podiums with round information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveRound"
  /v1/competitions/{competitionId}/live/registrations/{registrationId}:
    get:
      summary: Gets Information about the Competitors's live result
      tags:
        - live
      operationId: liveByPerson
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns a person and their results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePerson"
  /v0/competitions/{competitionId}/:
    get:
      summary: Get competition details
      tags:
        - competitions
      operationId: competitionById
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionInfo"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
  /v0/competitions/{competitionId}/events:
    get:
      summary: Get competition events in WCIF v0 format
      tags:
        - competitions
      operationId: competitionEvents
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WcifEvent"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
  /v0/competitions/{competitionId}/schedule:
    get:
      summary: Get competition schedule in WCIF format
      tags:
        - competitions
      operationId: competitionSchedule
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WcifSchedule"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
  /v0/competitions/{competitionId}/tabs:
    get:
      summary: Get competition tabs
      tags:
        - competitions
      operationId: competitionTabs
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tabs"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
  /v0/competitions/{competitionId}/registrations:
    get:
      summary: Get competition registrations
      tags:
        - competitions
      operationId: competitionRegistrations
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationData"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
  /v0/competitions/{competitionId}/podiums:
    get:
      summary: Returns the podium results
      tags:
        - competitions
      operationId: competitionPodiums
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Result"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
  /v0/competitions/{competitionId}/psych-sheet/{eventId}:
    get:
      summary: Get competition registrations
      tags:
        - results
        - competitions
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychSheet"
  /v0/competition_index:
    get:
      summary: Get a list of (upcoming) competitions for table display
      tags:
        - competitions
      operationId: competitionList
      parameters:
        - name: include_cancelled
          in: query
          schema:
            type: boolean
        - name: continent
          in: query
          schema:
            type: string
        - name: country_iso2
          in: query
          schema:
            type: string
        - name: delegate
          in: query
          schema:
            type: string
        - name: event_ids[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: start
          in: query
          schema:
            type: string
            format: datetime
        - name: end
          in: query
          schema:
            type: string
            format: datetime
        - name: admin_status
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: ongoing_and_future
          in: query
          schema:
            type: string
            format: datetime
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitionIndex"
  /v0/competitions:
    get:
      summary: Get a list of (upcoming) competitions for table display
      tags:
        - competitions
      operationId: competitionList2
      parameters:
        - name: include_cancelled
          in: query
          schema:
            type: boolean
        - name: continent
          in: query
          schema:
            type: string
        - name: country_iso2
          in: query
          schema:
            type: string
        - name: delegate
          in: query
          schema:
            type: string
        - name: event_ids[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: start
          in: query
          schema:
            type: string
            format: datetime
        - name: end
          in: query
          schema:
            type: string
            format: datetime
        - name: admin_status
          in: query
          schema:
            type: string
        - name: managed_by_me
          in: query
          schema:
            type: boolean
          description: Return competitions the authenticated user can manage. Requires manage_competitions scope.
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: ongoing_and_future
          in: query
          schema:
            type: string
            format: datetime
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitionIndex"
      security:
        - bearerAuth: []
  /v0/competitions/mine:
    get:
      summary: Get a list of a users competition
      operationId: getMyCompetitions
      tags:
        - competitions
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - past_competitions
                  - future_competitions
                  - bookmarked_competitions
                  - registrations_by_competition
                properties:
                  past_competitions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyCompetition"
                  future_competitions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyCompetition"
                  bookmarked_competitions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyCompetition"
                  registrations_by_competition:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/CompetingStatus"
  /v0/competitions/{competitionId}/results:
    get:
      summary: Returns all results
      operationId: resultsByCompetition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Results"
  /v0/competitions/{competitionId}/scrambles:
    get:
      summary: Returns the competition scrambles
      operationId: getScrambles
      tags:
        - competitions
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scramble"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
  /v0/results/rankings/{event_id}/{type}:
    get:
      summary: Get the current rankings
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: event_id
          in: path
          required: true
          schema:
            type: string
        - in: query
          name: region
          schema:
            type: string
        - in: query
          name: show
          schema:
            type: string
        - in: query
          name: gender
          schema:
            type: string
      operationId: getRankings
      responses:
        "200":
          description: Successfully retrieved rankings
          content:
            application/json:
              schema:
                type: object
                required:
                  - rankings
                  - timestamp
                properties:
                  rankings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExtendedResult"
                  timestamp:
                    type: string
                    format: date
  /v0/incidents:
    get:
      summary: Get a list of incidents
      tags:
        - regulations
      operationId: regulationsList
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
        - name: per_page
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
  /v0/search:
    get:
      summary: Omni-search across competitions, persons, regulations and incidents
      tags:
        - search
      operationId: omniSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
  /v0/results/records:
    get:
      summary: Get the current records for all regions
      parameters:
        - in: query
          name: event_id
          schema:
            type: string
        - in: query
          name: region
          schema:
            type: string
        - in: query
          name: show
          schema:
            type: string
        - in: query
          name: gender
          schema:
            type: string
      operationId: getRecords
      responses:
        "200":
          description: Successfully retrieved records
          content:
            application/json:
              schema:
                type: object
                required:
                  - records
                  - timestamp
                properties:
                  records:
                    $ref: "#/components/schemas/RecordByEvent"
                  timestamp:
                    type: string
                    format: date
  /v0/persons/{wca_id}/:
    get:
      summary: Get information for a person
      tags:
        - users
      operationId: personByWCAId
      parameters:
        - name: wca_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonInfo"
  /v0/persons/{wca_id}/results:
    get:
      summary: Get results for a person
      tags:
        - users
      operationId: personResults
