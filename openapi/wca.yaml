                $ref: "#/components/schemas/UserPermissions"
  /v0/regulations/translations:
    get:
      summary: Gets all translations of regulations
      tags:
        - regulations
      operationId: regulationTranslations
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegulationsTranslations"
  /v0/export/public:
    get:
      summary: Get Export Information
      tags:
        - results
      operationId: publicExports
      responses:
        "200":
          description: Successfully retrieved exports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportInfo"
  /v0/known-timezones:
    get:
      summary: Get a list of Olson timezones that the backend understands
      tags:
        - wca
      operationId: knownTimezones
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
