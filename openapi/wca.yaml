                  type: string
                  example: America/New_York
  /v0/regional-organizations:
    get:
      summary: A list of currently acknowledged regional organizations
      tags:
        - wca
      operationId: regionalOrganizations
      responses:
        "200":
          description: Retrieved organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionalOrganization"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistrationDataV2:
      type: object
      required:
        - id
        - registrant_id
        - user_id
        - user
        - competing
      properties:
        id:
          type: integer
        registrant_id:
          type: integer
        user_id:
          type: integer
        guests:
          type: integer
        user:
          type: object
          required:
            - id
            - name
            - gender
            - country_iso2
            - wca_id
          properties:
            id:
              type: integer
            name:
              type: string
            gender:
              type: string
            country_iso2:
              type: string
            wca_id:
              type:
                - string
                - "null"
            dob:
              type: string
              format: date
            email:
              type: string
              format: email
        competing:
          type: object
          required:
            - event_ids
          properties:
            event_ids:
              type: array
              items:
                type: string
            registration_status:
              type: string
            registered_on:
              type: string
              format: datetime
            comment:
              type: string
            admin_comment:
              type: string
        payment:
          type: object
          properties:
            has_paid:
              type: boolean
            payment_status:
              type: string
            paid_amount_iso:
              type: integer
            currency_code:
              type: string
            updated_at:
              type: string
              format: datetime
    BaseRegistrationConfig:
      type: object
      properties:
        key:
          type: string
        isEditable:
          type: boolean
        parameters:
          type: object
      required:
        - key
        - isEditable
    RequirementsStepConfig:
      allOf:
        - $ref: "#/components/schemas/BaseRegistrationConfig"
    WcifAttemptResult:
      type: integer
    WcifQualificationAttemptResult:
      type: object
      properties:
        whenDate:
          type: string
          format: date
        type:
          type: string
          example: attemptResult
        resultType:
          type: string
          enum:
            - single
            - average
        level:
          $ref: "#/components/schemas/WcifAttemptResult"
      required:
        - whenDate
        - type
        - resultType
        - level
    WcifRanking:
      type: integer
    WcifQualificationRanking:
      type: object
      properties:
        whenDate:
          type: string
          format: date
        type:
          type: string
          example: ranking
        resultType:
          type: string
          enum:
            - single
            - average
        level:
          $ref: "#/components/schemas/WcifRanking"
      required:
        - whenDate
        - type
        - resultType
        - level
    WcifQualificationAnyResult:
      type: object
      properties:
        whenDate:
          type: string
          format: date
        type:
          type: string
          example: anyResult
        resultType:
          type: string
          enum:
            - single
            - average
      required:
        - whenDate
        - type
        - resultType
    WcifQualification:
      oneOf:
        - $ref: "#/components/schemas/WcifQualificationAttemptResult"
        - $ref: "#/components/schemas/WcifQualificationRanking"
        - $ref: "#/components/schemas/WcifQualificationAnyResult"
      discriminator:
        propertyName: type
        mapping:
          attemptResult: "#/components/schemas/WcifQualificationAttemptResult"
          ranking: "#/components/schemas/WcifQualificationRanking"
          anyResult: "#/components/schemas/WcifQualificationAnyResult"
    WcifPersonalBest:
      type: object
      required:
        - eventId
        - best
        - worldRanking
        - continentalRanking
        - nationalRanking
        - type
      properties:
        eventId:
          type: string
          example: "333"
        best:
          $ref: "#/components/schemas/WcifAttemptResult"
        worldRanking:
          type: integer
        continentalRanking:
          type: integer
        nationalRanking:
          type: integer
        type:
          type: string
          enum:
            - single
            - average
    CompetingStepConfig:
      allOf:
        - $ref: "#/components/schemas/BaseRegistrationConfig"
        - type: object
          properties:
            parameters:
              type: object
              properties:
                events_per_registration_limit:
                  type: integer
                allow_registration_edits:
                  type: boolean
                guest_entry_status:
                  type: string
                  enum:
                    - unclear
                    - free
                    - restricted
                guests_per_registration_limit:
                  type: integer
                guests_enabled:
                  type: boolean
                uses_qualification?:
                  type: boolean
                allow_registration_without_qualification:
                  type: boolean
                force_comment_in_registration:
                  type: boolean
                qualification_wcif:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/WcifQualification"
                event_ids:
                  type: array
                  items:
                    type: string
                preferredEvents:
                  type: array
                  items:
                    type: string
                personalRecords:
                  type: object
                  properties:
                    single:
                      type: array
                      items:
                        $ref: "#/components/schemas/WcifPersonalBest"
                    average:
                      type: array
                      items:
                        $ref: "#/components/schemas/WcifPersonalBest"
                  required:
                    - single
                    - average
              required:
                - allow_registration_edits
                - guest_entry_status
                - guests_enabled
                - uses_qualification?
                - allow_registration_without_qualification
                - force_comment_in_registration
                - qualification_wcif
                - event_ids
                - preferredEvents
                - personalRecords
          required:
            - parameters
    PaymentStepConfig:
      allOf:
        - $ref: "#/components/schemas/BaseRegistrationConfig"
        - type: object
          properties:
            parameters:
              type: object
              properties:
                stripePublishableKey:
                  type: string
                connectedAccountId:
                  type: string
              required:
                - stripePublishableKey
                - connectedAccountId
          required:
            - parameters
    ApprovalStepConfig:
      allOf:
        - $ref: "#/components/schemas/BaseRegistrationConfig"
        - type: object
          properties:
            parameters:
              type: object
              properties:
                auto_accept_enabled?:
                  type: boolean
                auto_accept_preference:
                  type: string
                  enum:
                    - disabled
                    - bulk
                    - live
              required:
                - auto_accept_enabled?
          required:
            - parameters
    RegistrationConfig:
      oneOf:
        - $ref: "#/components/schemas/RequirementsStepConfig"
        - $ref: "#/components/schemas/CompetingStepConfig"
        - $ref: "#/components/schemas/PaymentStepConfig"
        - $ref: "#/components/schemas/ApprovalStepConfig"
      discriminator:
        propertyName: key
        mapping:
          requirements: "#/components/schemas/RequirementsStepConfig"
          competing: "#/components/schemas/CompetingStepConfig"
          payment: "#/components/schemas/PaymentStepConfig"
          approval: "#/components/schemas/ApprovalStepConfig"
    WcifTimeLimit:
      type: object
      properties:
        centiseconds:
          type: integer
          example: 18000
        cumulativeRoundIds:
          type: array
          items:
            type: string
      required:
        - centiseconds
        - cumulativeRoundIds
    WcifCutoff:
      type: object
      properties:
        numberOfAttempts:
          type: integer
          example: 2
        attemptResult:
          $ref: "#/components/schemas/WcifAttemptResult"
      required:
        - numberOfAttempts
        - attemptResult
    WcifAdvancementConditionRanking:
      type: object
      properties:
        type:
          type: string
          example: ranking
        level:
          $ref: "#/components/schemas/WcifRanking"
      required:
        - type
        - level
    WcifPercent:
      type: integer
    WcifAdvancementConditionPercent:
      type: object
      properties:
        type:
          type: string
          example: percent
        level:
          $ref: "#/components/schemas/WcifPercent"
      required:
        - type
        - level
    WcifAdvancementConditionAttemptResult:
      type: object
      properties:
        type:
          type: string
          example: attemptResult
        level:
          $ref: "#/components/schemas/WcifAttemptResult"
      required:
        - type
        - level
    WcifAdvancementCondition:
      oneOf:
        - $ref: "#/components/schemas/WcifAdvancementConditionRanking"
        - $ref: "#/components/schemas/WcifAdvancementConditionPercent"
        - $ref: "#/components/schemas/WcifAdvancementConditionAttemptResult"
      discriminator:
        propertyName: type
        mapping:
          ranking: "#/components/schemas/WcifAdvancementConditionRanking"
          percent: "#/components/schemas/WcifAdvancementConditionPercent"
          attemptResult: "#/components/schemas/WcifAdvancementConditionAttemptResult"
    WcifScramble:
      type: string
    WcifScrambleSet:
      type: object
      properties:
        id:
          type: integer
          example: 1
        scrambles:
          type: array
          items:
            $ref: "#/components/schemas/WcifScramble"
        extraScrambles:
          type: array
          items:
            $ref: "#/components/schemas/WcifScramble"
      required:
        - id
        - scrambles
        - extraScrambles
    BaseWcifRound:
      type: object
      properties:
        id:
          type: string
          example: 333-r1
        format:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
            - a
            - m
        timeLimit:
          $ref: "#/components/schemas/WcifTimeLimit"
        cutoff:
          $ref: "#/components/schemas/WcifCutoff"
        advancementCondition:
          $ref: "#/components/schemas/WcifAdvancementCondition"
        scrambleSetCount:
          type: integer
        scrambleSets:
          type: array
          items:
            $ref: "#/components/schemas/WcifScrambleSet"
        extensions:
          type: array
      required:
        - id
        - format
        - results
        - scrambleSetCount
        - scrambleSets
        - extensions
    WcifAttempt:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/WcifAttemptResult"
        reconstruction:
          type: string
      required:
        - result
    WcifResult:
      type: object
      properties:
        personId:
          type: integer
          example: 1
        ranking:
          type: integer
          example: 10
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/WcifAttempt"
        best:
          $ref: "#/components/schemas/WcifAttemptResult"
        average:
          $ref: "#/components/schemas/WcifAttemptResult"
      required:
        - personId
        - attempts
        - best
        - average
    WcifRound:
      allOf:
        - $ref: "#/components/schemas/BaseWcifRound"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/WcifResult"
          required:
            - results
    BaseAdminRound:
      allOf:
        - $ref: "#/components/schemas/WcifRound"
        - type: object
          required:
            - state
          properties:
            state:
              type: string
    OpenRound:
      allOf:
        - $ref: "#/components/schemas/BaseAdminRound"
        - type: object
          required:
            - total_competitors
            - competitors_live_results_entered
          properties:
            total_competitors:
              type: number
            competitors_live_results_entered:
              type: number
    LockedRound:
      allOf:
        - $ref: "#/components/schemas/BaseAdminRound"
        - type: object
          required:
            - total_competitors
          properties:
            total_competitors:
              type: number
    PendingRound:
      allOf:
        - $ref: "#/components/schemas/BaseAdminRound"
    ReadyRound:
      allOf:
        - $ref: "#/components/schemas/BaseAdminRound"
    LiveRoundAdmin:
      oneOf:
        - $ref: "#/components/schemas/OpenRound"
        - $ref: "#/components/schemas/LockedRound"
        - $ref: "#/components/schemas/PendingRound"
        - $ref: "#/components/schemas/ReadyRound"
      discriminator:
        propertyName: state
        mapping:
          open: "#/components/schemas/OpenRound"
          locked: "#/components/schemas/LockedRound"
          pending: "#/components/schemas/PendingRound"
          ready: "#/components/schemas/ReadyRound"
    LiveAttempt:
      type: object
      required:
        - value
        - attempt_number
      properties:
        value:
          type: integer
        attempt_number:
          type: integer
    BaseLiveResult:
      type: object
      required:
        - registration_id
        - best
        - average
        - single_record_tag
        - average_record_tag
        - advancing
        - advancing_questionable
        - attempts
        - last_attempt_entered_at
      properties:
        registration_id:
          type: integer
        best:
          type: integer
        average:
          type: integer
        single_record_tag:
          type: string
        average_record_tag:
          type: string
        advancing:
          type: boolean
        advancing_questionable:
          type: boolean
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/LiveAttempt"
        last_attempt_entered_at:
          type: string
          format: datetime
    RoundLiveResult:
      allOf:
        - $ref: "#/components/schemas/BaseLiveResult"
        - type: object
          required:
            - global_pos
            - local_pos
            - round_wcif_id
          properties:
            round_wcif_id:
              type: string
            global_pos:
              type: integer
            local_pos:
              type: integer
            forecast_statistics:
              type: object
              properties:
                best_possible_average:
                  type: integer
                worst_possible_average:
                  type: integer
    LiveCompetitor:
      type: object
      required:
        - id
        - registrant_id
        - name
        - country_iso2
        - user_id
      properties:
        id:
          type: number
        registrant_id:
          type: number
        user_id:
          type: number
        name:
          type: string
        country_iso2:
          type: string
    LiveRound:
      allOf:
        - $ref: "#/components/schemas/BaseWcifRound"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/RoundLiveResult"
            competitors:
              type: array
              items:
                $ref: "#/components/schemas/LiveCompetitor"
            round_id:
              type: number
            state_hash:
              type: string
            linked_round_ids:
              type: array
              items:
                type: string
          required:
            - results
            - competitors
            - round_id
            - state_hash
    SubmitLiveResult:
      type: object
      required:
        - attempts
        - registration_id
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/LiveAttempt"
        registration_id:
          type: number
    BatchSubmitLiveResult:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SubmitLiveResult"
    General404:
      type: object
      required:
        - error
        - data
      properties:
        error:
          type: string
        data:
          type: object
          required:
            - model
            - id
          properties:
            model:
              type: string
            id:
              type: string
    Competition404:
      allOf:
        - $ref: "#/components/schemas/General404"
        - type: object
          properties:
            data:
              type: object
              required:
                - model
                - id
              properties:
                model:
                  type: string
                  enum:
                    - Competition
                id:
                  type: string
    UserAvatar:
      type: object
      required:
        - url
        - is_default
      properties:
        url:
          type: string
          format: uri
          example: https://avatars.worldcubeassociation.org/uploads/user/avatar/2099EXAM/1535183030.jpg
        thumb_url:
          type: string
          format: uri
          example: https://avatars.worldcubeassociation.org/uploads/user/avatar/2099EXAM/1535183030_thumb.jpg
        is_default:
          type: boolean
    WcifRegistration:
      type: object
      required:
        - wcaRegistrationId
        - eventIds
        - status
        - isCompeting
      properties:
        wcaRegistrationId:
          type: number
        eventIds:
          type: array
          items:
            type: string
        status:
          type: string
        isCompeting:
          type: boolean
    WcifAssignment:
      type: object
      required:
        - activityId
        - stationNumber
        - assignmentCode
      properties:
        activityId:
          type: number
        stationNumber:
          type: number
        assignmentCode:
          type: string
    WcifPerson:
      type: object
      required:
        - registrantId
        - name
        - wcaUserId
        - countryIso2
        - gender
        - roles
        - assignments
        - personalBests
        - extensions
      properties:
        registrantId:
          type: number
        name:
          type: string
        wcaUserId:
          type: number
        countryIso2:
          type: string
        gender:
          type: string
        birthdate:
          type: string
          format: date
        email:
          type: string
          format: email
        avatar:
          $ref: "#/components/schemas/UserAvatar"
        roles:
          type: array
          items:
            type: string
            enum:
              - delegate
              - trainee-delegate
              - organizer
        registration:
          $ref: "#/components/schemas/WcifRegistration"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/WcifAssignment"
        personalBests:
          type: array
          items:
            $ref: "#/components/schemas/WcifPersonalBest"
        extensions:
          type: array
    ByPersonLiveResult:
      allOf:
        - $ref: "#/components/schemas/BaseLiveResult"
        - type: object
          required:
            - round_wcif_id
            - global_pos
            - local_pos
            - event_id
          properties:
            round_wcif_id:
              type: string
            global_pos:
              type: integer
            local_pos:
              type: integer
            event_id:
              type: string
    LivePerson:
      allOf:
        - $ref: "#/components/schemas/WcifPerson"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ByPersonLiveResult"
          required:
            - results
    TeamMembership:
      type: object
      required:
        - id
        - friendly_id
        - leader
        - senior_member
      properties:
        id:
          type: integer
        friendly_id:
          type: string
          example: wst
        leader:
          type: boolean
        senior_member:
          type: boolean
        name:
          type: string
        wca_id:
